name: Daily Status Check

on:
  schedule:
    # Run every day at 06:00 UTC (07:00 CET/08:00 CEST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  check-status:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push the status.json file
      
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Missing Reports Check
        env:
          IHKUSER: ${{ secrets.IHKUSER }}
          IHKPASS: ${{ secrets.IHKPASS }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: npx playwright test tests/check_missing_reports.spec.ts

      - name: Commit and Push Status
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/status.json
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update daily report status" && git push)
